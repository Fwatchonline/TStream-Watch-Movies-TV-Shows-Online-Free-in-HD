name: Deploy TStream

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tstream-online-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to TStream VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          test -n "$VPS_SSH_KEY_B64"
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null

          if [[ "$VPS_PORT" == "22" ]]; then
            KNOWN_HOST="$VPS_HOST"
          else
            KNOWN_HOST="[$VPS_HOST]:$VPS_PORT"
          fi

          printf '%s %s\n' "$KNOWN_HOST" \
            'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPnHaOxj0O4nk4a7572Ng/mhXpM/D8wcD09msz/hAdEI root@vultr' \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$KNOWN_HOST" -f "$HOME/.ssh/known_hosts"

      - name: Deploy latest main
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          ssh -T \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST"
